[project]
name = "zigai-temporal-sidecar"
version = "0.1.0"
description = "Temporal SDK sidecar for ZigAI durable operations"
requires-python = ">=3.11"
authors = [{ name = "Marcelo Trylesinski" }]
license = "MIT"
dependencies = [
    "aiohttp>=3.10,<4",
    "temporalio>=1.24,<2",
]

[project.scripts]
zigai-temporal-sidecar = "zigai_temporal_sidecar:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["zigai_temporal_sidecar.py", "zigai_temporal_workflow.py"]
