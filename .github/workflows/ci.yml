name: CI

on:
  push:
  pull_request:

permissions: read-all

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        optimize: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - shell: bash
        env:
          ZIGAI_OPTIMIZE: ${{ matrix.optimize }}
        run: ./scripts/check
      - if: runner.os != 'Windows'
        run: ./scripts/test-cli

  toolchain:
    strategy:
      matrix:
        include:
          - label: minimum
            version: 0.16.0
          - label: pinned
            version: 0.16.0
    name: toolchain (${{ matrix.label }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.version }}
      - run: ./scripts/check
      - run: zig build docs
      - run: zig build examples

  cross-target:
    strategy:
      matrix:
        target: [x86_64-windows, aarch64-linux, x86_64-macos]
    name: cross-target (${{ matrix.target }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build check -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

  source-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test a clean source archive
        run: |
          git archive --format=tar HEAD -o /tmp/zigai.tar
          mkdir /tmp/zigai-source
          tar -xf /tmp/zigai.tar -C /tmp/zigai-source
          cd /tmp/zigai-source
          zig build --fetch=all
          ./scripts/check

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: ./scripts/coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: coverage/merged/kcov-merged

  temporal-sidecar:
    runs-on: ubuntu-latest
    env:
      TEMPORAL_TEST_SERVER_CACHE: ${{ github.workspace }}/.temporal-test-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: integrations/temporal/uv.lock
      - uses: actions/cache@v4
        with:
          path: .temporal-test-server
          key: temporal-test-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('integrations/temporal/uv.lock') }}
      - run: uv sync --project integrations/temporal --locked
      - run: >-
          uv run --project integrations/temporal python -m unittest discover
          -s integrations/temporal
          -p 'test_*.py'

  fuzz-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: ./scripts/fuzz 1000

  stress-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        optimize: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: ./scripts/stress ${{ matrix.optimize }}

  benchmark:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-aarch64
    name: benchmark (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Measure and compare
        shell: bash
        run: >-
          zig build benchmark -Doptimize=ReleaseSafe --
          check benchmarks/baselines/${{ matrix.target }}.json
          benchmark-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.target }}
          path: benchmark-report.json
