version: 1
interactions:
- request:
    method: POST
    uri: "https://compatible.test/v1/chat/completions"
    headers: {}
    body:
      type: json
      content:
        model: "compat-test"
        messages:
          - role: "system"
            content: "You are concise."
          - role: "user"
            content: "What is the weather?"
        tools:
          - type: "function"
            function:
              name: "weather"
              description: "Get weather."
              parameters:
                type: "object"
        stream: true
        stream_options:
          include_usage: true
  response:
    status: 200
    headers: {}
    body:
      type: text
      content: |+
        data: {"choices":[{"delta":{"tool_calls":[{"index":0,"id":"call_compat","function":{"name":"weather","arguments":"{\"city\":"}}]},"finish_reason":null}]}

        data: {"choices":[{"delta":{"tool_calls":[{"index":0,"function":{"arguments":"\"Madrid\"}"}}]},"finish_reason":null}]}

        data: {"choices":[{"delta":{},"finish_reason":"tool_calls"}]}

        data: {"choices":[],"usage":{"prompt_tokens":10,"completion_tokens":4}}

        data: [DONE]
- request:
    method: POST
    uri: "https://compatible.test/v1/chat/completions"
    headers: {}
    body:
      type: json
      content:
        model: "compat-test"
        messages:
          - role: "system"
            content: "You are concise."
          - role: "user"
            content: "What is the weather?"
          - role: "assistant"
            content: null
            tool_calls:
              - id: "call_compat"
                type: "function"
                function:
                  name: "weather"
                  arguments: "{\"city\":\"Madrid\"}"
          - role: "tool"
            tool_call_id: "call_compat"
            content: "{\"temperature_c\":31}"
        tools:
          - type: "function"
            function:
              name: "weather"
              description: "Get weather."
              parameters:
                type: "object"
        stream: true
        stream_options:
          include_usage: true
  response:
    status: 200
    headers: {}
    body:
      type: text
      content: |+
        data: {"choices":[{"delta":{"content":"It is sunny "},"finish_reason":null}]}

        data: {"choices":[{"delta":{"content":"in Madrid."},"finish_reason":"stop"}]}

        data: {"choices":[],"usage":{"prompt_tokens":18,"completion_tokens":6}}

        data: [DONE]
