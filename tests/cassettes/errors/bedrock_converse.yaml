version: 1
interactions:
- request: &request
    method: POST
    uri: "https://bedrock-runtime.example-region.amazonaws.com/model/us.anthropic.claude-sonnet-4-6/converse"
    headers: {}
    body: &body
      type: json
      content:
        messages:
          - role: "user"
            content:
              - text: "Reply with exactly: pong"
        inferenceConfig:
          maxTokens: 64
  response:
    status: 429
    headers:
      retry-after:
      - "3"
      x-ratelimit-remaining-requests:
      - "0"
      x-ratelimit-remaining-tokens:
      - "12"
      x-request-id:
      - "req_rate_bedrock"
    body:
      type: json
      content:
        error:
          code: "rate_limit"
          message: "slow down"
- request:
    method: POST
    uri: "https://bedrock-runtime.example-region.amazonaws.com/model/us.anthropic.claude-sonnet-4-6/converse"
    headers: {}
    body: *body
  response:
    status: 200
    headers: {}
    body:
      type: json
      content:
        output:
          message:
            role: "assistant"
            content:
              - text: "pong"
        stopReason: "end_turn"
        usage:
          inputTokens: 1
          outputTokens: 1
          totalTokens: 2
- request:
    method: POST
    uri: "https://bedrock-runtime.example-region.amazonaws.com/model/us.anthropic.claude-sonnet-4-6/converse"
    headers: {}
    body: *body
  response: &server_error
    status: 503
    headers:
      x-request-id:
      - "req_server_bedrock"
    body:
      type: json
      content:
        error:
          code: "unavailable"
          message: "temporarily unavailable"
- request:
    method: POST
    uri: "https://bedrock-runtime.example-region.amazonaws.com/model/us.anthropic.claude-sonnet-4-6/converse"
    headers: {}
    body: *body
  response: *server_error
- request:
    method: POST
    uri: "https://bedrock-runtime.example-region.amazonaws.com/model/us.anthropic.claude-sonnet-4-6/converse"
    headers: {}
    body: *body
  response:
    status: 200
    headers: {}
    body:
      type: json
      content: {}
- request:
    method: POST
    uri: "https://bedrock-runtime.example-region.amazonaws.com/model/us.anthropic.claude-sonnet-4-6/converse"
    headers: {}
    body: *body
  response:
    status: 400
    headers:
      x-request-id:
      - "req_bad_bedrock"
    body:
      type: json
      content:
        error:
          code: "bad_request_code"
          message: "provider failure message that is intentionally longer than the observer limit"
