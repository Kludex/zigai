version: 1
interactions:
- request:
    method: POST
    uri: "https://api.anthropic.com/v1/messages"
    headers: {}
    body:
      type: json
      content:
        model: "claude-sonnet-5"
        max_tokens: 256
        messages:
          - role: "user"
            content:
              - type: "text"
                text: "Reply with exactly: pong"
  response:
    status: 200
    headers:
      x-ratelimit-remaining-requests:
      - "19999"
      x-ratelimit-remaining-tokens:
      - "12000000"
      x-request-id:
      - "req_011Ce5VhK9h1jo1ori3MwGTe"
    body:
      type: json
      content:
        model: "claude-sonnet-5"
        id: "msg_011Ce5VhKajgWCgTmqbMG7Fd"
        type: "message"
        role: "assistant"
        content:
          - type: "text"
            text: "pong"
        stop_reason: "end_turn"
        stop_sequence: null
        stop_details: null
        usage:
          input_tokens: 16
          cache_creation_input_tokens: 0
          cache_read_input_tokens: 0
          cache_creation:
            ephemeral_5m_input_tokens: 0
            ephemeral_1h_input_tokens: 0
          output_tokens: 4
          output_tokens_details:
            thinking_tokens: 0
          service_tier: "standard"
          inference_geo: "global"
