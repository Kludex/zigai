version: 1
interactions:
- request:
    method: POST
    uri: "https://openai.test/v1/responses"
    headers: {}
    body:
      type: json
      content:
        model: "gpt-test"
        input:
          - type: "message"
            role: "system"
            content: "You are concise."
          - type: "message"
            role: "user"
            content: "What is the weather?"
        tools:
          - type: "function"
            name: "weather"
            description: "Get weather."
            parameters:
              type: "object"
  response:
    status: 200
    headers: {}
    body:
      type: json
      content:
        output:
          - type: "function_call"
            call_id: "call-weather"
            name: "weather"
            arguments: "{\"city\":\"Madrid\"}"
        usage:
          input_tokens: 10
          output_tokens: 4
- request:
    method: POST
    uri: "https://openai.test/v1/responses"
    headers: {}
    body:
      type: json
      content:
        model: "gpt-test"
        input:
          - type: "message"
            role: "system"
            content: "You are concise."
          - type: "message"
            role: "user"
            content: "What is the weather?"
          - type: "function_call"
            call_id: "call-weather"
            name: "weather"
            arguments: "{\"city\":\"Madrid\"}"
          - type: "function_call_output"
            call_id: "call-weather"
            output: "{\"temperature_c\":31}"
        tools:
          - type: "function"
            name: "weather"
            description: "Get weather."
            parameters:
              type: "object"
  response:
    status: 200
    headers: {}
    body:
      type: json
      content:
        output:
          - type: "message"
            content:
              - type: "output_text"
                text: "It is sunny in Madrid."
        usage:
          input_tokens: 18
          output_tokens: 6
