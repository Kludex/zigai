                {"ZjwXSU0x": {"url": "https://github.com/ziglang/zig/releases", "title": "Releases · ziglang/zig", "description": "Notifications · You must be signed in to change notification settings · Fork 3.2k · <strong>Star 43.3k</strong> · Releases · ziglang/zig · Previous Next · Jump to release · 0.15.1 · 0.14.1 ·", "snippets": ["Notifications · You must be signed in to change notification settings · Fork 3.2k · <strong>Star 43.3k</strong> · Releases · ziglang/zig · Previous Next · Jump to release · 0.15.1 · 0.14.1 ·", "ziglang / zig Public · There was an error while loading. Please reload this page. Notifications · You must be signed in to change notification settings · Fork 3.2k · Star 43.3k · Releases · ziglang/zig · Previous Next · Jump to release · 0.15.1 · 0.14.1 ·"], "date": null, "rank": 0, "source": "brave", "metadata": {"lang": "en", "thumbnail": "https://opengraph.githubassets.com/cec024cc4e47354be8968c02af477b63711e639aa8b4dda017bf8ada624debee/ziglang/zig", "favicon": "https://imgs.search.brave.com/xxsA4YxzaR0cl-DBsH9-lpv2gsif3KMYgM87p26bs_o/rs:fit:32:32:1:0/g:ce/aHR0cDovL2Zhdmlj/b25zLnNlYXJjaC5i/cmF2ZS5jb20vaWNv/bnMvYWQyNWM1NjA5/ZjZmZjNlYzI2MDNk/N2VkNmJhYjE2MzZl/MDY5ZTMxMDUzZmY1/NmU3NWIzNWVmMjk0/NTBjMjJjZi9naXRo/dWIuY29tLw", "source": "brave"}, "can_open": true}, "IoLsH6qg": {"url": "https://daily.dev/blog/zig-0-16-new-features-release-date-developers-need-to-know/", "title": "Zig 0.16: New Features, Release Date, and What Developers Need to Know | daily.dev", "description": "The stable release of <strong>Zig 0.16</strong> is anticipated within the next few weeks. The timeline, initially projected for January–February 2026, was extended due to the complexity of the type resolution overhaul and the integration of async I/O features .", "snippets": ["The stable release of <strong>Zig 0.16</strong> is anticipated within the next few weeks. The timeline, initially projected for January–February 2026, was extended due to the complexity of the type resolution overhaul and the integration of async I/O features .", "The stable release of Zig 0.16 is anticipated within the next few weeks. The timeline, initially projected for January–February 2026, was extended due to the complexity of the type resolution overhaul and the integration of async I/O features . Now that these major components have been finalized, the remaining tasks involve refining and testing the build. For those eager to explore the new features, master builds reflecting the current state of the 0.16.0-dev branch are available for download at ziglang.org/download .", "If you're eager to check out Zig 0.16 before its stable release, head over to the official Zig website and grab the latest master build. Make sure to use the incremental compilation flag - it can help simplify and speed up your development process. Keep in mind, though, that these builds come with the latest features but might also include bugs or breaking changes.", "Zig 0.16 is almost here, with a stable release expected in the coming weeks. This version focuses on improving asynchronous I/O, type resolution, and package management.", "Zig 0.16 revamps async I/O, overhauls type resolution, and updates package management; with master builds and faster incremental compilation."], "date": null, "rank": 1, "source": "brave", "metadata": {"lang": "en", "thumbnail": "https://media.daily.dev/image/upload/s--D_vq5Vz1--/f_auto,q_auto/v1/recruiter-landing/69cde3101b352ff267cd0f12_1775103026400_d044d5ee49?_a=BAMAMiB80", "favicon": "https://imgs.search.brave.com/6alMaegX5Pig28qDWPROKKhRdUWZv9o8v_DcuZuLvqY/rs:fit:32:32:1:0/g:ce/aHR0cDovL2Zhdmlj/b25zLnNlYXJjaC5i/cmF2ZS5jb20vaWNv/bnMvMTY2ZjQ1NzRh/MzFiOTQ0NDc0ZTM2/YzRkYTVkNjc0ODE2/MTI3YjBhYjZkZWJl/NDlmYzI3NmI5MTU5/ODVhMTI5MS9kYWls/eS5kZXYv", "source": "brave"}, "can_open": true}, "kam0erPD": {"url": "https://ziglang.org/download/0.15.1/release-notes.html", "title": "0.15.1 Release Notes ⚡ The Zig Programming Language", "description": "<strong>Zig 0.15</strong>.x makes further progress on the work-in-progress Incremental Compilation functionality, which allows the compiler to perform very fast rebuilds by only re-compiling code which has changed. Various bugs have been fixed, particularly relating to changing file imports.", "snippets": ["<strong>Zig 0.15</strong>.x makes further progress on the work-in-progress Incremental Compilation functionality, which allows the compiler to perform very fast rebuilds by only re-compiling code which has changed. Various bugs have been fixed, particularly relating to changing file imports.", "This is only the beginning; the self-hosted x86_64 backend has been built to support Incremental Compilation, which will result in another extreme speed-up when it is stable enough to be enabled by default. Fast compilation is a key goal of the Zig project, and one we have been quietly making progress on for years—this release sees those efforts starting to come to fruition. Using the self-hosted x86 backend also means you are not subject to the effects of upstream LLVM bugs, of which we are currently tracking over 60.", "In this release, we've started the effort to share code between the statically-linked libcs that Zig provides—currently musl, wasi-libc, and MinGW-w64—by reimplementing common functions in Zig code in the new zig libc library.", "Zig 0.15.x makes further progress on the work-in-progress Incremental Compilation functionality, which allows the compiler to perform very fast rebuilds by only re-compiling code which has changed. Various bugs have been fixed, particularly relating to changing file imports. This feature is still experimental—it has known bugs and can lead to miscompilations or incorrect compile errors. However, it is now stable enough to be used reliably in combination with -fno-emit-bin.", "In fact, the self-hosted x86 backend already passes a larger subset of our \"behavior test suite\" than the LLVM backend does (1984/2008 vs 1977/2008). In other words, this backend provides a more complete and correct implementation of the Zig language. Of course, the self-hosted x86 backend does currently have some deficiencies and bugs of its own."], "date": null, "rank": 2, "source": "brave", "metadata": {"lang": "en", "thumbnail": null, "favicon": "https://imgs.search.brave.com/eopWUq2zbXyGPKh4LxGmFvjHHtkvseqfikQPm8jDhKA/rs:fit:32:32:1:0/g:ce/aHR0cDovL2Zhdmlj/b25zLnNlYXJjaC5i/cmF2ZS5jb20vaWNv/bnMvYTdjNGI4YTYy/NjA3ZWRkMzAwMmI0/YWViMWU0YmE1N2Zi/Zjk0YmRmMWZlYmM5/YTUxNWIzZWUxZjhh/ZjBkYWI0Zi96aWds/YW5nLm9yZy8", "source": "brave"}, "can_open": true}, "jDgasNyf": {"url": "https://ziglang.org/download/", "title": "Download ⚡ Zig Programming Language", "description": "If you’re automating the process of downloading Zig, you might want to learn about Community Mirrors to avoid downtime and help us save on bandwidth costs.", "snippets": ["If you’re automating the process of downloading Zig, you might want to learn about Community Mirrors to avoid downtime and help us save on bandwidth costs.", "If you’re automating the process of downloading Zig, you might want to learn about Community Mirrors to avoid downtime and help us save on bandwidth costs.", "Download Learn News Source Join a Community Zig Software Foundation Devlog"], "date": null, "rank": 3, "source": "brave", "metadata": {"lang": "en", "thumbnail": null, "favicon": "https://imgs.search.brave.com/eopWUq2zbXyGPKh4LxGmFvjHHtkvseqfikQPm8jDhKA/rs:fit:32:32:1:0/g:ce/aHR0cDovL2Zhdmlj/b25zLnNlYXJjaC5i/cmF2ZS5jb20vaWNv/bnMvYTdjNGI4YTYy/NjA3ZWRkMzAwMmI0/YWViMWU0YmE1N2Zi/Zjk0YmRmMWZlYmM5/YTUxNWIzZWUxZjhh/ZjBkYWI0Zi96aWds/YW5nLm9yZy8", "source": "brave"}, "can_open": true}, "IDdqef2D": {"url": "https://ziglang.org/download/0.14.0/release-notes.html", "title": "0.14.0 Release Notes ⚡ The Zig Programming Language", "description": "<strong>Zig 0.14.0</strong> changes CallingConvention to be far more exhaustive: it now contains every major calling convention for every target currently supported by Zig. Variants have names like .x86_64_sysv, .arm_aapcs, and .riscv64_interrupt.", "snippets": ["<strong>Zig 0.14.0</strong> changes CallingConvention to be far more exhaustive: it now contains every major calling convention for every target currently supported by Zig. Variants have names like .x86_64_sysv, .arm_aapcs, and .riscv64_interrupt.", "Tuples currently do not have optimized layout, but this can be changed in the future. This change simplifies the language, and fixes some problematic coercions through pointers which led to unintuitive behavior. Zig allows setting the calling convention of a function with the callconv(...) annotation, where the value in parentheses is of type std.builtin.CallingConvention.", "Zig 0.14.0 changes CallingConvention to be far more exhaustive: it now contains every major calling convention for every target currently supported by Zig. Variants have names like .x86_64_sysv, .arm_aapcs, and .riscv64_interrupt.", "Zig development is funded via Zig Software Foundation, a 501(c)(3) non-profit organization. Please consider a recurring donation so that we can offer more billable hours to our core team members. This is the most straightforward way to accelerate the project along the Roadmap to 1.0. This release features 9 months of work: changes from 251 different contributors, spread among 3467 commits.", "Along with a slew of Build System upgrades, Language Changes, and Target Support enhancements, this release strides towards two of our long-term investments - Incremental Compilation and fast x86 Backend - both focused on reducing edit/compile/debug cycle latency. ... Thank You Contributors! Thank You Sponsors! A major theme in this Zig release is improved target support; the list of targets that Zig can correctly cross-compile to and run on has been greatly expanded."], "date": null, "rank": 4, "source": "brave", "metadata": {"lang": "en", "thumbnail": null, "favicon": "https://imgs.search.brave.com/eopWUq2zbXyGPKh4LxGmFvjHHtkvseqfikQPm8jDhKA/rs:fit:32:32:1:0/g:ce/aHR0cDovL2Zhdmlj/b25zLnNlYXJjaC5i/cmF2ZS5jb20vaWNv/bnMvYTdjNGI4YTYy/NjA3ZWRkMzAwMmI0/YWViMWU0YmE1N2Zi/Zjk0YmRmMWZlYmM5/YTUxNWIzZWUxZjhh/ZjBkYWI0Zi96aWds/YW5nLm9yZy8", "source": "brave"}, "can_open": true}, "CYaPz5S5": {"url": "https://www.reddit.com/r/Zig/comments/1oxx9c3/new_to_zig_is_0152_the_latest/", "title": "New to Zig! Is 0.15.2 the latest? : r/Zig", "description": "Technically master is always latest, when using the Zig ecosystem as far as libraries, most projects either track master or the last tagged release (<strong>0.15.2</strong> in this case).", "snippets": ["Technically master is always latest, when using the Zig ecosystem as far as libraries, most projects either track master or the last tagged release (<strong>0.15.2</strong> in this case).", "The only official releases are through their website and Git tags! On Github, there is a tag for 0.15.2 ... Ugh, can't believe I missed that. Thanks! ... And there's a link to the docs on the homepage right underneath that. And per their Github wiki, Homebrew is also on 0.15.2. ... Others have already answered your question, but I recommend using ZVM to manage Zig.", "If you're contributing to projects, you'll probably be switching zig versions frequently as many projects wait a long time before updating. ... if you typed this message out on desktop, there is a \"switch to markdown editor\" button somewhere around the text area · glad you got it figured out! something probably happened when brew updated to 5.0.0 (released yesterday)", "I think the terminology was off. When they said \"No docs\", I think they really meant \"no release notes\". There's no 0.15.2 release on github, so there's no way to see what changed from 0.15.1 to 0.15.2. The std docs are indeed 0.15.2: https://ziglang.org/documentation/0.15.2", "Technically master is always latest, when using the Zig ecosystem as far as libraries, most projects either track master or the last tagged release (0.15.2 in this case)."], "date": null, "rank": 5, "source": "brave", "metadata": {"lang": "en", "thumbnail": null, "favicon": "https://imgs.search.brave.com/U-eHNCapRHVNWWCVPPMTIvOofZULh0_A_FQKe8xTE4I/rs:fit:32:32:1:0/g:ce/aHR0cDovL2Zhdmlj/b25zLnNlYXJjaC5i/cmF2ZS5jb20vaWNv/bnMvN2ZiNTU0M2Nj/MTFhZjRiYWViZDlk/MjJiMjBjMzFjMDRk/Y2IzYWI0MGI0MjVk/OGY5NzQzOGQ5NzQ5/NWJhMWI0NC93d3cu/cmVkZGl0LmNvbS8", "source": "brave"}, "can_open": true}, "c34yzvrK": {"url": "https://ziglang.org/download/0.16.0/release-notes.html", "title": "0.16.0 Release Notes ⚡ The Zig Programming Language", "description": "For example, File System operations directly call read, write, open, close, etc. When updating code from <strong>Zig 0.15</strong>.x, using this implementation provides the equivalent behavior. This implementation is feature-complete and well-tested, including Cancelation. This is the implementation currently ...", "snippets": ["For example, File System operations directly call read, write, open, close, etc. When updating code from <strong>Zig 0.15</strong>.x, using this implementation provides the equivalent behavior. This implementation is feature-complete and well-tested, including Cancelation. This is the implementation currently ...", "Along with the interface, this release comes with the following implementations: Io.Threaded - based on threads. With this implementation, I/O operations are straightforward. For example, File System operations directly call read, write, open, close, etc. When updating code from Zig 0.15.x, using this implementation provides the equivalent behavior. This implementation is feature-complete and well-tested, including Cancelation. This is the implementation currently chosen by \"Juicy Main\".", "Zig development is funded via Zig Software Foundation, a 501(c)(3) non-profit organization. Please consider a recurring donation so that we can offer more billable hours to our core team members. This is the most straightforward way to accelerate the project along the Roadmap to 1.0. If you need donation receipts or are looking to migrate away from GitHub Sponsors, we recommend donating via Every.org. This release features 8 months of work: changes from 244 different contributors, spread among 1183 commits.", "Perhaps most notably, this release debuts I/O as an Interface, but don't sleep on the Language Changes or enhancements to the Compiler, Build System, Linker, Fuzzer, and Toolchain which are also included in this release. ... Thank You Contributors! Thank You Sponsors! Zig supports a wide range of architectures and operating systems.", "Zig's level of support for various targets is broadly categorized into four tiers with Tier 1 being the highest. The goal is for Tier 1 targets to have zero disabled tests - this will become a requirement for post-1.0.0 Zig releases."], "date": null, "rank": 6, "source": "brave", "metadata": {"lang": "en", "thumbnail": null, "favicon": "https://imgs.search.brave.com/eopWUq2zbXyGPKh4LxGmFvjHHtkvseqfikQPm8jDhKA/rs:fit:32:32:1:0/g:ce/aHR0cDovL2Zhdmlj/b25zLnNlYXJjaC5i/cmF2ZS5jb20vaWNv/bnMvYTdjNGI4YTYy/NjA3ZWRkMzAwMmI0/YWViMWU0YmE1N2Zi/Zjk0YmRmMWZlYmM5/YTUxNWIzZWUxZjhh/ZjBkYWI0Zi96aWds/YW5nLm9yZy8", "source": "brave"}, "can_open": true}, "57Q8NxjC": {"url": "https://ziggit.dev/t/zig-0-15-1-released/11583", "title": "Zig 0.15.1 Released - News - Ziggit", "description": "<strong>(0.15.0</strong> was retracted)", "snippets": ["<strong>(0.15.0</strong> was retracted)", "(0.15.0 was retracted)"], "date": null, "rank": 7, "source": "brave", "metadata": {"lang": "en", "thumbnail": "https://ziggit.dev/uploads/default/original/1X/3417db0e8abaf83a355700b91efd528025492487.png", "favicon": "https://imgs.search.brave.com/De4sfG0321FP0Kdzyz1XKaiA67EAddH4MnjnjBnWQi0/rs:fit:32:32:1:0/g:ce/aHR0cDovL2Zhdmlj/b25zLnNlYXJjaC5i/cmF2ZS5jb20vaWNv/bnMvNTc3MTAzMjg5/MTIyMjEyYTNkZTgw/ZTgxODE0Zjk3Njcw/NGZkMGU4YmJhMzli/ZWVkMjk3OGE1NWVl/OWNiODQyMC96aWdn/aXQuZGV2Lw", "source": "brave"}, "can_open": true}, "d9r3KDSG": {"url": "https://ziggit