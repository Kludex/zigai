            name: "test_input_required_result_capabilities"
          - description: "Tests JSON Schema 2020-12 keyword preservation in tools/list (inputSchema installed below)."
            inputSchema:
              "$schema": "https://json-schema.org/draft/2020-12/schema"
              type: "object"
              "$defs":
                address:
                  "$anchor": "addressDef"
                  type: "object"
                  properties:
                    street:
                      type: "string"
                    city:
                      type: "string"
              properties:
                name:
                  type: "string"
                address:
                  "$ref": "#/$defs/address"
                contactMethod:
                  type: "string"
                  enum:
                    - "phone"
                    - "email"
                phone:
                  type: "string"
                email:
                  type: "string"
              allOf:
                - anyOf:
                    - required:
                        - "phone"
                    - required:
                        - "email"
              if:
                properties:
                  contactMethod:
                    const: "phone"
                required:
                  - "contactMethod"
              then:
                required:
                  - "phone"
              else:
                required:
                  - "email"
              additionalProperties: false
            name: "json_schema_2020_12_tool"
            outputSchema:
              properties:
                result:
                  title: "Result"
                  type: "string"
              required:
                - "result"
              title: "json_schema_2020_12_toolOutput"
